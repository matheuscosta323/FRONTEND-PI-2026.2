<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lote | NomeProjeto</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/components.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.469.0/dist/umd/lucide.min.js" defer></script>
  <script type="module" src="../js/pages/lote.js" defer></script>
</head>
<body>
  <aside class="sidebar" id="menu"></aside>
  <div class="content">
    <header class="topbar">
      <h1 id="greeting">Bom dia, Rafael</h1>
      <p id="updatedAt">Atualizada às --:--</p>
    </header>
    <main class="page">
      <div class="page-head">
        <h2 id="titulo">Lote</h2>
        <div class="botoes">
          <a class="btn-outline" href="../index.html"><i data-lucide="layout-grid"></i>Voltar ao dashboard</a>
          <a class="btn-outline" href="lotes.html"><i data-lucide="map"></i>Voltar para os lotes</a>
        </div>
      </div>
      <section class="kpis duas" id="kpis"></section>
      <div class="lote-grid">
        <section class="card">
          <p class="empty" id="semSensor" hidden>Este lote ainda não tem sensor conectado.</p>
          <div class="grafico-bloco">
            <div class="grafico-topo"><span><i class="dot dot-umid"></i>Umidade do ar</span><select id="periodoUmidade"><option value="1">Último dia</option><option value="3">Últimos 3 dias</option><option value="7" selected>Últimos 7 dias</option></select></div>
            <div class="chart-wrap"><canvas id="chartUmidade"></canvas></div>
          </div>
          <div class="grafico-bloco">
            <div class="grafico-topo"><span><i class="dot dot-temp"></i>Temperatura</span><select id="periodoTemp"><option value="1">Último dia</option><option value="3">Últimos 3 dias</option><option value="7" selected>Últimos 7 dias</option></select></div>
            <div class="chart-wrap"><canvas id="chartTemp"></canvas></div>
          </div>
        </section>
        <section class="card alerts-card">
          <h2>Alertas do lote</h2>
          <div class="alerts-list" id="alertsLote"></div>
          <a class="btn-soft" id="ligar" href="#">Ligar para a Transportadora</a>
        </section>
      </div>
    </main>
  </div>
</body>
</html>
