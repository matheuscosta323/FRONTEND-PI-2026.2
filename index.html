<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Visão geral | NomeProjeto</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.469.0/dist/umd/lucide.min.js" defer></script>
  <script type="module" src="js/main.js" defer></script>
</head>
<body>
  <aside class="sidebar" id="menu"></aside>

  <div class="content">
    <header class="topbar">
      <h1 id="greeting">Bom dia, Rafael</h1>
      <p id="updatedAt">Atualizada às --:--</p>
    </header>

    <main class="page">
      <section class="kpis" id="kpis" aria-label="Resumo"></section>

      <section class="card chart-card">
        <div class="card-head">
          <h2>Condições ao longo do tempo</h2>
          <a class="btn-outline" href="pages/relatorio.html">Ver relatório<i data-lucide="arrow-right"></i></a>
        </div>
        <div class="chart-body">
          <div>
            <div class="legend">
              <span><i class="dot dot-temp"></i>Temperatura</span>
              <span><i class="dot dot-umid"></i>Umidade do ar</span>
            </div>
            <div class="chart-wrap"><canvas id="chartCondicoes"></canvas></div>
          </div>
          <div class="side-stats" id="sideStats"></div>
        </div>
      </section>

      <div class="bottom">
        <section class="card">
          <div class="card-head">
            <h2>Lotes monitorados</h2>
            <a class="btn-outline" href="pages/lotes.html">Ver todos<i data-lucide="arrow-right"></i></a>
          </div>
          <div class="table-scroll">
            <table class="table">
              <thead><tr><th>Lote</th><th>Fruta</th><th>Status</th><th>Última leitura</th></tr></thead>
              <tbody id="lotesBody"></tbody>
            </table>
          </div>
        </section>

        <section class="card alerts-card">
          <h2>Alertas recentes</h2>
          <div class="alerts-list" id="alertsList"></div>
          <a class="btn-soft" href="pages/alertas.html">Abrir central de alertas</a>
        </section>
      </div>
    </main>
  </div>
</body>
</html>
